<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#ea6c00"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(60 40)">
    <rect width="320" height="320" rx="80" fill="url(#mark)"/>
    <text x="160" y="160" text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="800" fill="#ffffff">&#8355;</text>
  </g>

  <!-- Wordmark -->
  <text x="440" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="130" font-weight="800" fill="#f1f5f9">CMF<tspan fill="#f7931a">.digital</tspan></text>

  <!-- Tagline -->
  <text x="444" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="500" fill="#94a3b8" letter-spacing="1">The future of property management.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#ea6c00"/>
    </linearGradient>
  </defs>

  <!-- Logo mark -->
  <g transform="translate(40 40)">
    <rect width="320" height="320" rx="80" fill="url(#mark)"/>
    <text x="160" y="160" text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="800" fill="#ffffff">&#8355;</text>
  </g>

  <!-- Wordmark -->
  <text x="420" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="140" font-weight="800" fill="#0f172a">CMF<tspan fill="#f7931a">.digital</tspan></text>

  <!-- Tagline -->
  <text x="424" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="500" fill="#64748b" letter-spacing="1">The future of property management.</text>
</svg>
